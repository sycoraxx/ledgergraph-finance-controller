<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040" role="img" aria-labelledby="title desc">
  <title id="title">Finance Controller system architecture</title>
  <desc id="desc">Bank records, a centrally represented Razorpay settlement report, and cashbook records enter as equal evidence. They are verified, grouped into a LedgerGraph candidate mesh, resolved by deterministic controls, and sent either to review or through a human approval gate into a simulation ledger. An optional AI assistant can only explain cited evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07100d"/>
      <stop offset="0.56" stop-color="#0a1712"/>
      <stop offset="1" stop-color="#10231a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14241d"/>
      <stop offset="1" stop-color="#0c1713"/>
    </linearGradient>
    <linearGradient id="mintCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#183326"/>
      <stop offset="1" stop-color="#10231a"/>
    </linearGradient>
    <linearGradient id="amberCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#302514"/>
      <stop offset="1" stop-color="#17160f"/>
    </linearGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#9cf7c5" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L12 6L0 12Z" fill="#66877a"/>
    </marker>
    <marker id="mintArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L12 6L0 12Z" fill="#9cf7c5"/>
    </marker>
    <style>
      .title{font:700 42px Inter,Segoe UI,Arial,sans-serif;fill:#edf7f2;letter-spacing:-1.4px}
      .subtitle{font:400 18px Inter,Segoe UI,Arial,sans-serif;fill:#90a49b}
      .section{font:800 13px Inter,Segoe UI,Arial,sans-serif;fill:#77a08e;letter-spacing:2.2px}
      .step{font:800 13px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#9cf7c5;letter-spacing:1.2px}
      .cardTitle{font:700 22px Inter,Segoe UI,Arial,sans-serif;fill:#e6f0eb}
      .cardBody{font:400 16px Inter,Segoe UI,Arial,sans-serif;fill:#91a39b}
      .small{font:600 13px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#6f857b}
      .pill{font:800 12px Inter,Segoe UI,Arial,sans-serif;letter-spacing:.7px}
      .flow{fill:none;stroke:#66877a;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .flowMint{fill:none;stroke:#9cf7c5;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#mintArrow)}
      .soft{fill:none;stroke:#4e685d;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 8}
    </style>
  </defs>

  <rect width="1800" height="1040" rx="30" fill="url(#bg)"/>
  <rect width="1800" height="1040" rx="30" fill="url(#grid)"/>
  <circle cx="1510" cy="-80" r="380" fill="#2b7953" opacity="0.08"/>
  <circle cx="230" cy="1080" r="360" fill="#2b7953" opacity="0.06"/>

  <text x="72" y="78" class="title">From raw records to a safe accounting decision</text>
  <text x="72" y="112" class="subtitle">Every amount is calculated by code. Every exception is visible. Every posting waits for a person.</text>

  <text x="72" y="174" class="section">SIMULATED INPUTS</text>
  <text x="420" y="174" class="section">DETERMINISTIC CONTROL PIPELINE</text>
  <text x="1470" y="174" class="section">VISIBLE OUTCOMES</text>

  <!-- Sources -->
  <g filter="url(#shadow)">
    <rect x="72" y="204" width="280" height="116" rx="18" fill="url(#card)" stroke="#2b4339"/>
    <rect x="72" y="342" width="280" height="116" rx="18" fill="url(#card)" stroke="#2b4339"/>
    <rect x="72" y="480" width="280" height="116" rx="18" fill="url(#card)" stroke="#2b4339"/>
  </g>
  <circle cx="108" cy="240" r="16" fill="#102a38" stroke="#67c3e7"/>
  <text x="140" y="247" class="cardTitle">Bank</text>
  <text x="108" y="282" class="cardBody">Simulated bank statement</text>
  <text x="108" y="304" class="small">credits + debits</text>
  <circle cx="108" cy="378" r="16" fill="#173425" stroke="#9cf7c5"/>
  <text x="140" y="385" class="cardTitle">Razorpay</text>
  <text x="108" y="420" class="cardBody">Test-mode settlement report</text>
  <text x="108" y="442" class="small">hosted or generated</text>
  <circle cx="108" cy="516" r="16" fill="#322813" stroke="#dcb45b"/>
  <text x="140" y="523" class="cardTitle">Cashbook</text>
  <text x="108" y="558" class="cardBody">Simulated accounting export</text>
  <text x="108" y="580" class="small">expected entries</text>

  <!-- Source convergence -->
  <path d="M352 262H382V400H412" class="soft"/>
  <path d="M352 400H412" class="soft"/>
  <path d="M352 538H382V400" class="soft"/>

  <!-- Verify -->
  <g filter="url(#shadow)">
    <rect x="420" y="262" width="270" height="276" rx="22" fill="url(#card)" stroke="#315044"/>
  </g>
  <text x="454" y="306" class="step">01 · VERIFY</text>
  <text x="454" y="348" class="cardTitle">Trust the batch</text>
  <text x="454" y="383" class="cardBody">Check columns and types</text>
  <text x="454" y="415" class="cardBody">Stamp extraction time</text>
  <text x="454" y="447" class="cardBody">Hash every source file</text>
  <rect x="454" y="478" width="196" height="34" rx="17" fill="#132a20" stroke="#335b48"/>
  <circle cx="476" cy="495" r="5" fill="#9cf7c5"/>
  <text x="491" y="500" class="pill" fill="#9cf7c5">AUDITABLE INPUT</text>

  <path d="M690 400H730" class="flow"/>

  <!-- Candidate mesh -->
  <g filter="url(#shadow)">
    <rect x="746" y="222" width="326" height="356" rx="22" fill="url(#card)" stroke="#315044"/>
  </g>
  <text x="780" y="266" class="step">02 · BUILD POSSIBILITIES</text>
  <text x="780" y="308" class="cardTitle">LedgerGraph mesh</text>
  <text x="780" y="336" class="cardBody">Show every plausible group</text>
  <!-- Mini mesh -->
  <g opacity="0.9" transform="translate(0 -18)">
    <path d="M812 390L910 416L1014 372M812 438L910 416L1014 464M812 486L910 456L1014 464M812 390L1014 512M812 520L910 456" fill="none" stroke="#6e8d80" stroke-width="2"/>
    <path d="M812 438L1014 372M812 486L1014 512" fill="none" stroke="#b46551" stroke-opacity=".75" stroke-width="2" stroke-dasharray="5 5"/>
    <circle cx="812" cy="390" r="9" fill="#67c3e7"/><circle cx="812" cy="438" r="9" fill="#67c3e7"/><circle cx="812" cy="486" r="9" fill="#67c3e7"/><circle cx="812" cy="520" r="9" fill="#67c3e7"/>
    <circle cx="910" cy="416" r="7" fill="#9cf7c5"/><circle cx="910" cy="456" r="7" fill="#9cf7c5"/>
    <circle cx="1014" cy="372" r="9" fill="#dcb45b"/><circle cx="1014" cy="464" r="9" fill="#dcb45b"/><circle cx="1014" cy="512" r="9" fill="#dcb45b"/>
  </g>
  <text x="790" y="532" class="small">BANK</text>
  <text x="868" y="532" class="small" fill="#8fb6a4">SETTLEMENT</text>
  <text x="976" y="532" class="small">CASHBOOK</text>
  <text x="780" y="558" class="small">1:1  ·  1:N  ·  N:1  ·  N:M</text>

  <path d="M1072 400H1112" class="flow"/>

  <!-- Solver -->
  <g filter="url(#shadow)">
    <rect x="1128" y="262" width="282" height="276" rx="22" fill="url(#mintCard)" stroke="#47735d"/>
  </g>
  <text x="1162" y="306" class="step">03 · DECIDE</text>
  <text x="1162" y="348" class="cardTitle">Exact batch answer</text>
  <text x="1162" y="383" class="cardBody">Money must balance</text>
  <text x="1162" y="415" class="cardBody">Dates must make sense</text>
  <text x="1162" y="447" class="cardBody">A record is used once</text>
  <rect x="1162" y="478" width="208" height="34" rx="17" fill="#173525" stroke="#3c6c53"/>
  <text x="1183" y="500" class="pill" fill="#9cf7c5">AI CANNOT OVERRIDE</text>

  <!-- Split -->
  <path d="M1410 400H1438V290H1454" class="flowMint"/>
  <path d="M1438 400V510H1454" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="1470" y="222" width="258" height="134" rx="20" fill="url(#mintCard)" stroke="#47735d"/>
    <rect x="1470" y="444" width="258" height="134" rx="20" fill="url(#amberCard)" stroke="#6b5533"/>
  </g>
  <text x="1504" y="263" class="step">MATCHED</text>
  <text x="1504" y="300" class="cardTitle">Proven groups</text>
  <text x="1504" y="329" class="cardBody">with evidence + citations</text>
  <text x="1504" y="485" class="step" fill="#ffca76">NEEDS REVIEW</text>
  <text x="1504" y="522" class="cardTitle">Honest exceptions</text>
  <text x="1504" y="551" class="cardBody">ties · gaps · control stops</text>

  <!-- Approval lane -->
  <path d="M1599 356V390H1752V604H1155V614" class="flowMint"/>
  <g filter="url(#shadow)">
    <rect x="1000" y="630" width="310" height="150" rx="22" fill="url(#card)" stroke="#315044"/>
    <rect x="1370" y="630" width="358" height="150" rx="22" fill="url(#mintCard)" stroke="#47735d"/>
  </g>
  <text x="1034" y="674" class="step">04 · PREPARE</text>
  <text x="1034" y="714" class="cardTitle">Balanced journal</text>
  <text x="1034" y="746" class="cardBody">A proposal—not a posting</text>
  <path d="M1310 705H1354" class="flowMint"/>
  <text x="1404" y="674" class="step">05 · HUMAN GATE</text>
  <text x="1404" y="714" class="cardTitle">Approve or reject</text>
  <text x="1404" y="746" class="cardBody">Then record once in the simulation ledger</text>

  <!-- AI / evidence sidecar -->
  <path d="M900 578V814" class="soft"/>
  <path d="M1549 780V806H1388V814" class="soft"/>
  <g filter="url(#shadow)">
    <rect x="420" y="830" width="1000" height="146" rx="22" fill="#0b1512" stroke="#426154" stroke-width="2" stroke-dasharray="9 8"/>
  </g>
  <rect x="454" y="858" width="194" height="30" rx="15" fill="#1c2c25"/>
  <text x="475" y="878" class="pill" fill="#b9cbc3">OPTIONAL AI SIDECAR</text>
  <text x="454" y="925" class="cardTitle">Explain “why?” from cited records</text>
  <text x="454" y="955" class="cardBody">Read-only wording help; deterministic evidence remains the source of truth.</text>
  <rect x="1084" y="868" width="292" height="64" rx="16" fill="#241514" stroke="#653832"/>
  <text x="1112" y="894" class="pill" fill="#ff897d">NO MONEY AUTHORITY</text>
  <text x="1112" y="919" class="small" fill="#b98982">cannot match · approve · post</text>
</svg>
